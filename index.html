<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>テープ電卓</title>
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* デフォルト（ライトモード）の色定義 */
        :root {
            --bg-main: #f3f4f6;
            --text-main: #111827;
            --bg-tape: #ffffff;
            --bg-display: #e5e7eb;
            --text-display: #111827;
            --bg-key-num: #ffffff;
            --text-key-num: #111827;
            --bg-key-fn: #e5e7eb;
            --text-key-fn: #111827;
            --bg-key-op: #00a4b8;
            --text-key-op: #ffffff;
            --border-color: #d1d5db;
            --grid-bg: #d1d5db;
        }

        /* スマホがダークモードの場合に適用される色定義 */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-main: #000000;
                --text-main: #ffffff;
                --bg-tape: #000000;
                --bg-display: #111111;
                --text-display: #d1d5db;
                --bg-key-num: #141414;
                --text-key-num: #ffffff;
                --bg-key-fn: #000000;
                --text-key-fn: #ffffff;
                --bg-key-op: #00a4b8;
                --text-key-op: #ffffff;
                --border-color: #222222;
                --grid-bg: #222222;
            }
        }

        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .key-active:active { filter: brightness(1.3); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* スタイル連動クラス */
        .btn-num { background-color: var(--bg-key-num); color: var(--text-key-num); }
        .btn-fn { background-color: var(--bg-key-fn); color: var(--text-key-fn); }
        .btn-op { background-color: var(--bg-key-op); color: var(--text-key-op); }
        .area-display { background-color: var(--bg-display); border-color: var(--border-color); }
        .area-grid { background-color: var(--grid-bg); }
        .text-disp { color: var(--text-display); }
    </style>
</head>
<body class="flex flex-col justify-between w-full relative h-screen">

    <!-- 1. 計算履歴 (テープエリア) -->
    <div id="tape-container" class="flex-1 overflow-y-auto p-4 flex flex-col justify-start space-y-3 min-h-0 overscroll-contain touch-pan-y">
        <div id="tape-list" class="flex flex-col space-y-2"></div>
    </div>

    <!-- キーパッドとディスプレイの固定コンテナ -->
    <div class="flex-none border-t" style="border-color: var(--border-color); padding-bottom: max(0.25rem, env(safe-area-inset-bottom));">
        <!-- 2. Display / 合計表示エリア -->
        <div class="area-display px-4 py-3 border-b flex flex-col space-y-1">
            <!-- 入力中の計算式を表示する領域 -->
            <div id="expression-display" class="text-right text-sm text-gray-400 tracking-wide h-5 overflow-x-auto no-scrollbar"></div>
            <!-- 現在の数値入力・計算結果領域 -->
            <div id="current-input" class="text-right text-3xl font-light text-disp tracking-wide min-h-[40px] overflow-x-auto no-scrollbar">0</div>
            <div class="flex justify-between items-center opacity-70 pt-1 border-t" style="border-color: var(--border-color);">
                <span class="text-sm font-medium">合計</span>
                <div class="flex items-center space-x-1 cursor-pointer" onclick="tapeCalc.copyTotal()">
                    <span id="grand-total" class="text-xl font-bold tracking-wide">0</span>
                    <span class="text-sm opacity-50">›</span>
                </div>
            </div>
        </div>

        <!-- 3. キーパッド -->
        <div class="grid grid-cols-4 gap-[1px] area-grid">
            <button onclick="tapeCalc.clear()" class="btn-fn text-2xl h-14 flex items-center justify-center key-active font-normal">AC</button>
            <button onclick="tapeCalc.clearTape()" class="btn-fn text-xl h-14 flex items-center justify-center key-active font-normal">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
            <button onclick="tapeCalc.backspace()" class="btn-fn text-xl h-14 flex items-center justify-center key-active font-normal">⌫</button>
            <button onclick="tapeCalc.setOperator('÷')" class="btn-op text-3xl h-14 flex items-center justify-center key-active font-normal">÷</button>

            <button onclick="tapeCalc.appendNum('7')" class="btn-num text-2xl h-14 flex items-center justify-center key-active font-normal">7</button>
            <button onclick="tapeCalc.appendNum('8')" class="btn-num text-2xl h-14 flex items-center justify-center key-active font-normal">8</button>
            <button onclick="tapeCalc.appendNum('9')" class="btn-num text-2xl h-14 flex items-center justify-center key-active font-normal">9</button>
            <button onclick="tapeCalc.setOperator('×')" class="btn-op text-2xl h-14 flex items-center justify-center key-active font-normal">×</button>

            <button onclick="tapeCalc.appendNum('4')" class="btn-num text-2xl h-14 flex items-center justify-center key-active font-normal">4</button>
            <button onclick="tapeCalc.appendNum('5')" class="btn-num text-2xl h-14 flex items-center justify-center key-active font-normal">5</button>
            <button onclick="tapeCalc.appendNum('6')" class="btn-num text-2xl h-14 flex items-center justify-center key-active font-normal">6</button>
            <button onclick="tapeCalc.setOperator('-')" class="btn-op text-3xl h-14 flex items-center justify-center key-active font-normal">-</button>

            <button onclick="tapeCalc.appendNum('1')" class="btn-num text-2xl h-14 flex items-center justify-center key-active font-normal">1</button>
            <button onclick="tapeCalc.appendNum('2')" class="btn-num text-2xl h-14 flex items-center justify-center key-active font-normal">2</button>
            <button onclick="tapeCalc.appendNum('3')" class="btn-num text-2xl h-14 flex items-center justify-center key-active font-normal">3</button>
            <button onclick="tapeCalc.setOperator('+')" class="btn-op text-3xl h-14 flex items-center justify-center key-active font-normal">+</button>

            <button onclick="tapeCalc.appendNum('0')" class="btn-num text-2xl h-14 flex items-center justify-center key-active font-normal">0</button>
            <button onclick="tapeCalc.appendDot()" class="btn-num text-2xl h-14 flex items-center justify-center key-active font-normal">.</button>
            <button onclick="tapeCalc.toggleSign()" class="btn-num text-xl h-14 flex items-center justify-center key-active font-normal">⁺/₋</button>
            <button onclick="tapeCalc.calculate()" class="btn-op text-3xl h-14 flex items-center justify-center key-active font-normal">=</button>
        </div>
    </div>

    <!-- 4. JavaScript制御 -->
    <script>
        class TapeCalculator {
            constructor() {
                this.currentInput = '0';
                this.prevInput = null;
                this.operator = null;
                this.shouldResetInput = false;
                this.tapeHistory = [];
                
                this.expressionDisplayEl = document.getElementById('expression-display');
                this.currentInputEl = document.getElementById('current-input');
                this.tapeListEl = document.getElementById('tape-list');
                this.grandTotalEl = document.getElementById('grand-total');
                this.tapeContainerEl = document.getElementById('tape-container');

                this.initKeyboard();
            }

            formatNum(numStr) {
                if (numStr === '' || numStr === null || numStr === undefined) return '0';
                const parts = numStr.toString().split('.');
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                return parts.join('.');
            }

            unformatNum(formattedStr) {
                return formattedStr.toString().replace(/,/g, '');
            }

            updateDisplay() {
                this.currentInputEl.textContent = this.formatNum(this.currentInput);
                
                // 演算子と前の入力値がある場合、＝を押すまでは計算式（例: 10 + 5）を表示
                if (this.operator && this.prevInput !== null) {
                    if (this.shouldResetInput) {
                        this.expressionDisplayEl.textContent = `${this.formatNum(this.prevInput)} ${this.operator}`;
                    } else {
                        this.expressionDisplayEl.textContent = `${this.formatNum(this.prevInput)} ${this.operator} ${this.formatNum(this.currentInput)}`;
                    }
                } else {
                    this.expressionDisplayEl.textContent = '';
                }
            }

            appendNum(num) {
                if (this.currentInput === '0' || this.shouldResetInput) {
                    this.currentInput = num;
                    this.shouldResetInput = false;
                } else {
                    if (this.currentInput.replace(/,/g, '').length < 12) {
                        this.currentInput += num;
                    }
                }
                this.updateDisplay();
            }

            appendDot() {
                if (this.shouldResetInput) {
                    this.currentInput = '0.';
                    this.shouldResetInput = false;
                } else if (!this.currentInput.includes('.')) {
                    this.currentInput += '.';
                }
                this.updateDisplay();
            }

            toggleSign() {
                if (this.currentInput !== '0') {
                    this.currentInput = this.currentInput.startsWith('-') ? this.currentInput.slice(1) : '-' + this.currentInput;
                    this.updateDisplay();
                }
            }

            backspace() {
                if (this.shouldResetInput) return;
                if (this.currentInput.length > 1) {
                    this.currentInput = this.currentInput.slice(0, -1);
                    if (this.currentInput === '-') this.currentInput = '0';
                } else {
                    this.currentInput = '0';
                }
                this.updateDisplay();
            }

            setOperator(op) {
                // 連続計算（＝を押さずに＋やーを押し続ける場合）の処理
                if (this.operator && !this.shouldResetInput) {
                    this.calculate(false);
                }
                this.prevInput = this.currentInput;
                this.operator = op;
                this.shouldResetInput = true;
                this.updateDisplay();
            }

            calculate(isEqualsPressed = true) {
                if (!this.operator || this.prevInput === null) return;

                const n1 = parseFloat(this.unformatNum(this.prevInput));
                const n2 = parseFloat(this.unformatNum(this.currentInput));
                let res = 0;

                switch (this.operator) {
                    case '+': res = n1 + n2; break;
                    case '-': res = n1 - n2; break;
                    case '×': res = n1 * n2; break;
                    case '÷': res = n2 !== 0 ? n1 / n2 : 0; break;
                }

                res = Math.round(res * 1e10) / 1e10;
                const expStr = `${this.formatNum(n1)} ${this.operator} ${this.formatNum(n2)}`;
                
                this.addTapeItem(expStr, res);
                this.currentInput = res.toString();

                if (isEqualsPressed) {
                    // ＝が押された場合のみ、計算式表示をクリアする
                    this.operator = null;
                    this.prevInput = null;
                } else {
                    // 途中で演算子が押された場合は計算結果を保持して連続計算
                    this.prevInput = res.toString();
                }
                this.shouldResetInput = true;
                this.updateDisplay();
            }

            addTapeItem(expression, result) {
                this.tapeHistory.push(result);
                const itemEl = document.createElement('div');
                itemEl.className = 'flex justify-between items-center text-xl font-normal py-1 border-b opacity-90 cursor-pointer px-1 rounded transition-colors';
                itemEl.style.borderColor = 'var(--border-color)';
                itemEl.onclick = () => {
                    this.currentInput = result.toString();
                    this.shouldResetInput = true;
                    this.updateDisplay();
                };

                itemEl.innerHTML = `
                    <span class="opacity-80">${expression} =</span>
                    <span class="font-semibold">${this.formatNum(result)}</span>
                `;

                this.tapeListEl.appendChild(itemEl);
                this.updateGrandTotal();
                
                setTimeout(() => {
                    this.tapeContainerEl.scrollTop = this.tapeContainerEl.scrollHeight;
                }, 50);
            }

            updateGrandTotal() {
                const total = this.tapeHistory.reduce((acc, curr) => acc + curr, 0);
                const roundedTotal = Math.round(total * 1e10) / 1e10;
                this.grandTotalEl.textContent = this.formatNum(roundedTotal);
            }

            clear() {
                this.currentInput = '0';
                this.prevInput = null;
                this.operator = null;
                this.shouldResetInput = false;
                this.updateDisplay();
            }

            clearTape() {
                this.tapeHistory = [];
                this.tapeListEl.innerHTML = '';
                this.updateGrandTotal();
            }

            copyTotal() {
                navigator.clipboard.writeText(this.grandTotalEl.textContent);
            }

            initKeyboard() {
                window.addEventListener('keydown', (e) => {
                    if (e.key >= '0' && e.key <= '9') this.appendNum(e.key);
                    if (e.key === '.') this.appendDot();
                    if (e.key === '+') this.setOperator('+');
                    if (e.key === '-') this.setOperator('-');
                    if (e.key === '*') this.setOperator('×');
                    if (e.key === '/') { e.preventDefault(); this.setOperator('÷'); }
                    if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); this.calculate(); }
                    if (e.key === 'Backspace') this.backspace();
                    if (e.key === 'Escape') this.clear();
                });
            }
        }

        const tapeCalc = new TapeCalculator();
    </script>
</body>
</html>
