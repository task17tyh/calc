<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>テープ電卓</title>
    <!-- Web App Manifest (PWA設定) -->
    <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22テープ電卓%22,%22short_name%22:%22テープ電卓%22,%22start_url%22:%22./%22,%22display%22:%22standalone%22,%22background_color%22:%22%23000000%22,%22theme_color%22:%22%23000000%22}">
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .key-active:active { filter: brightness(1.4); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-black text-white h-screen flex flex-col justify-end overflow-hidden max-w-md mx-auto relative pb-10 pb-[env(safe-area-inset-bottom)]">

    <!-- 1. 計算履歴 (テープエリア) -->
    <div id="tape-container" class="flex-1 overflow-y-auto p-4 flex flex-col justify-end no-scrollbar space-y-3">
        <div id="tape-list" class="flex flex-col space-y-2"></div>
    </div>

    <!-- 2. Display / 合計表示エリア -->
    <div class="bg-[#111] px-4 py-3 border-t border-b border-[#222] flex flex-col space-y-1">
        <div id="current-input" class="text-right text-3xl font-light text-gray-300 tracking-wide min-h-[40px] overflow-x-auto no-scrollbar">0</div>
        <div class="flex justify-between items-center text-gray-400 pt-1 border-t border-[#222]">
            <span class="text-sm font-medium">合計</span>
            <div class="flex items-center space-x-1 cursor-pointer" onclick="tapeCalc.copyTotal()">
                <span id="grand-total" class="text-xl font-bold text-white tracking-wide">0</span>
                <span class="text-gray-500 text-sm">›</span>
            </div>
        </div>
    </div>

    <!-- 3. キーパッド -->
    <div class="grid grid-cols-4 gap-[1px] bg-[#222] pb-2">
        <button onclick="tapeCalc.clear()" class="bg-black text-white text-2xl h-16 flex items-center justify-center key-active font-normal">AC</button>
        <button onclick="tapeCalc.clearTape()" class="bg-black text-white text-xl h-16 flex items-center justify-center key-active font-normal">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
        <button onclick="tapeCalc.backspace()" class="bg-black text-white text-xl h-16 flex items-center justify-center key-active font-normal">⌫</button>
        <button onclick="tapeCalc.setOperator('÷')" class="bg-[#00a4b8] text-white text-3xl h-16 flex items-center justify-center key-active font-normal">÷</button>

        <button onclick="tapeCalc.appendNum('7')" class="bg-[#141414] text-white text-2xl h-16 flex items-center justify-center key-active font-normal">7</button>
        <button onclick="tapeCalc.appendNum('8')" class="bg-[#141414] text-white text-2xl h-16 flex items-center justify-center key-active font-normal">8</button>
        <button onclick="tapeCalc.appendNum('9')" class="bg-[#141414] text-white text-2xl h-16 flex items-center justify-center key-active font-normal">9</button>
        <button onclick="tapeCalc.setOperator('×')" class="bg-[#00a4b8] text-white text-2xl h-16 flex items-center justify-center key-active font-normal">×</button>

        <button onclick="tapeCalc.appendNum('4')" class="bg-[#141414] text-white text-2xl h-16 flex items-center justify-center key-active font-normal">4</button>
        <button onclick="tapeCalc.appendNum('5')" class="bg-[#141414] text-white text-2xl h-16 flex items-center justify-center key-active font-normal">5</button>
        <button onclick="tapeCalc.appendNum('6')" class="bg-[#141414] text-white text-2xl h-16 flex items-center justify-center key-active font-normal">6</button>
        <button onclick="tapeCalc.setOperator('-')" class="bg-[#00a4b8] text-white text-3xl h-16 flex items-center justify-center key-active font-normal">-</button>

        <button onclick="tapeCalc.appendNum('1')" class="bg-[#141414] text-white text-2xl h-16 flex items-center justify-center key-active font-normal">1</button>
        <button onclick="tapeCalc.appendNum('2')" class="bg-[#141414] text-white text-2xl h-16 flex items-center justify-center key-active font-normal">2</button>
        <button onclick="tapeCalc.appendNum('3')" class="bg-[#141414] text-white text-2xl h-16 flex items-center justify-center key-active font-normal">3</button>
        <button onclick="tapeCalc.setOperator('+')" class="bg-[#00a4b8] text-white text-3xl h-16 flex items-center justify-center key-active font-normal">+</button>

        <button onclick="tapeCalc.appendNum('0')" class="bg-[#141414] text-white text-2xl h-16 flex items-center justify-center key-active font-normal">0</button>
        <button onclick="tapeCalc.appendDot()" class="bg-[#141414] text-white text-2xl h-16 flex items-center justify-center key-active font-normal">.</button>
        <button onclick="tapeCalc.toggleSign()" class="bg-[#141414] text-white text-xl h-16 flex items-center justify-center key-active font-normal">⁺/₋</button>
        <button onclick="tapeCalc.calculate()" class="bg-[#00a4b8] text-white text-3xl h-16 flex items-center justify-center key-active font-normal">=</button>
    </div>

    <!-- 4. オフライン動作制御（Service Worker） -->
    <script>
        // オフラインキャッシュの登録
        if ('serviceWorker' in navigator) {
            const swCode = `
                const CACHE_NAME = 'tape-calc-v1';
                self.addEventListener('install', e => {
                    e.waitUntil(caches.open(CACHE_NAME).then(cache => cache.addAll(['./'])));
                });
                self.addEventListener('fetch', e => {
                    e.respondWith(caches.match(e.request).then(res => res || fetch(e.request)));
                });
            `;
            const blob = new Blob([swCode], { type: 'application/javascript' });
            navigator.serviceWorker.register(URL.createObjectURL(blob)).catch(() => {});
        }

        class TapeCalculator {
            constructor() {
                this.currentInput = '0';
                this.prevInput = null;
                this.operator = null;
                this.shouldResetInput = false;
                this.tapeHistory = [];
                
                this.currentInputEl = document.getElementById('current-input');
                this.tapeListEl = document.getElementById('tape-list');
                this.grandTotalEl = document.getElementById('grand-total');
                this.tapeContainerEl = document.getElementById('tape-container');

                this.initKeyboard();
            }

            formatNum(numStr) {
                if (numStr === '' || numStr === null || numStr === undefined) return '0';
                const parts = numStr.toString().split('.');
                parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
                return parts.join('.');
            }

            unformatNum(formattedStr) {
                return formattedStr.toString().replace(/,/g, '');
            }

            updateDisplay() {
                this.currentInputEl.textContent = this.formatNum(this.currentInput);
            }

            appendNum(num) {
                if (this.currentInput === '0' || this.shouldResetInput) {
                    this.currentInput = num;
                    this.shouldResetInput = false;
                } else {
                    if (this.currentInput.replace(/,/g, '').length < 12) {
                        this.currentInput += num;
                    }
                }
                this.updateDisplay();
            }

            appendDot() {
                if (this.shouldResetInput) {
                    this.currentInput = '0.';
                    this.shouldResetInput = false;
                } else if (!this.currentInput.includes('.')) {
                    this.currentInput += '.';
                }
                this.updateDisplay();
            }

            toggleSign() {
                if (this.currentInput !== '0') {
                    this.currentInput = this.currentInput.startsWith('-') ? this.currentInput.slice(1) : '-' + this.currentInput;
                    this.updateDisplay();
                }
            }

            backspace() {
                if (this.shouldResetInput) return;
                if (this.currentInput.length > 1) {
                    this.currentInput = this.currentInput.slice(0, -1);
                    if (this.currentInput === '-') this.currentInput = '0';
                } else {
                    this.currentInput = '0';
                }
                this.updateDisplay();
            }

            setOperator(op) {
                if (this.operator && !this.shouldResetInput) {
                    this.calculate(false);
                }
                this.prevInput = this.currentInput;
                this.operator = op;
                this.shouldResetInput = true;
            }

            calculate(isEqualsPressed = true) {
                if (!this.operator || this.prevInput === null) return;

                const n1 = parseFloat(this.unformatNum(this.prevInput));
                const n2 = parseFloat(this.unformatNum(this.currentInput));
                let res = 0;

                switch (this.operator) {
                    case '+': res = n1 + n2; break;
                    case '-': res = n1 - n2; break;
                    case '×': res = n1 * n2; break;
                    case '÷': res = n2 !== 0 ? n1 / n2 : 0; break;
                }

                res = Math.round(res * 1e10) / 1e10;
                const expStr = `${this.formatNum(n1)} ${this.operator} ${this.formatNum(n2)}`;
                
                this.addTapeItem(expStr, res);
                this.currentInput = res.toString();
                this.updateDisplay();

                if (isEqualsPressed) {
                    this.operator = null;
                    this.prevInput = null;
                } else {
                    this.prevInput = res.toString();
                }
                this.shouldResetInput = true;
            }

            addTapeItem(expression, result) {
                this.tapeHistory.push(result);
                const itemEl = document.createElement('div');
                itemEl.className = 'flex justify-between items-center text-xl font-normal py-1 border-b border-gray-900/50 cursor-pointer hover:bg-gray-900/40 px-1 rounded transition-colors';
                itemEl.onclick = () => {
                    this.currentInput = result.toString();
                    this.shouldResetInput = true;
                    this.updateDisplay();
                };

                itemEl.innerHTML = `
                    <span class="text-gray-200">${expression} =</span>
                    <span class="text-white font-semibold">${this.formatNum(result)}</span>
                `;

                this.tapeListEl.appendChild(itemEl);
                this.updateGrandTotal();
                
                setTimeout(() => {
                    this.tapeContainerEl.scrollTop = this.tapeContainerEl.scrollHeight;
                }, 50);
            }

            updateGrandTotal() {
                const total = this.tapeHistory.reduce((acc, curr) => acc + curr, 0);
                const roundedTotal = Math.round(total * 1e10) / 1e10;
                this.grandTotalEl.textContent = this.formatNum(roundedTotal);
            }

            clear() {
                this.currentInput = '0';
                this.prevInput = null;
                this.operator = null;
                this.shouldResetInput = false;
                this.updateDisplay();
            }

            clearTape() {
                this.tapeHistory = [];
                this.tapeListEl.innerHTML = '';
                this.updateGrandTotal();
            }

            copyTotal() {
                navigator.clipboard.writeText(this.grandTotalEl.textContent);
            }

            initKeyboard() {
                window.addEventListener('keydown', (e) => {
                    if (e.key >= '0' && e.key <= '9') this.appendNum(e.key);
                    if (e.key === '.') this.appendDot();
                    if (e.key === '+') this.setOperator('+');
                    if (e.key === '-') this.setOperator('-');
                    if (e.key === '*') this.setOperator('×');
                    if (e.key === '/') { e.preventDefault(); this.setOperator('÷'); }
                    if (e.key === 'Enter' || e.key === '=') { e.preventDefault(); this.calculate(); }
                    if (e.key === 'Backspace') this.backspace();
                    if (e.key === 'Escape') this.clear();
                });
            }
        }

        const tapeCalc = new TapeCalculator();
    </script>
</body>
</html>
